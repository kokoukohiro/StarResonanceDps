name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Check the tag against the app version
        shell: pwsh
        run: |
          [xml]$project = Get-Content -Raw StarResonanceDps.App/StarResonanceDps.App.csproj
          $version = $project.Project.PropertyGroup.Version | Select-Object -First 1
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "The tag $env:GITHUB_REF_NAME does not match the app version $version in StarResonanceDps.App.csproj."
          }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Publish
        shell: pwsh
        run: dotnet publish StarResonanceDps.App/StarResonanceDps.App.csproj -c Release -r win-x64 --self-contained false -o publish "-p:PathMap=$env:GITHUB_WORKSPACE=/_"

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath "StarResonanceDps-$env:VERSION.zip"

      - name: Create a draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME "StarResonanceDps-$env:VERSION.zip" --draft --title $env:GITHUB_REF_NAME --notes ''
